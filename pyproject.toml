[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nightwatch-os-dashboard"
version = "0.2.0"
description = "Nightwatch operator runtime — local-first shift, task, and system state for OBEOS and standalone use."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.10.0",
  "psutil>=6.1.0",
  "tomli>=2.0.1; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
]

[project.scripts]
nightwatch = "nightwatch.__main__:main"

[tool.setuptools]
packages = ["nightwatch"]

[tool.setuptools.package-data]
nightwatch = ["static/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
